<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>T04 – SVG House &amp; Garden</title>
	<style>
		body {
			margin: 0;
			padding: 2rem;
			background: #eef6f8;
			color: #263238;
			font-family: Georgia, "Times New Roman", serif;
		}

		main {
			max-width: 800px;
			margin: 0 auto;
		}

		h1 {
			margin: 0 0 1rem;
			color: #234b59;
			font-size: 1.8rem;
		}

		svg {
			display: block;
			width: 100%;
			height: auto;
			border: 3px solid #234b59;
			background: #bfe7f5;
		}

		#scene-annotated #annotations {
			font-size: 12px;
			fill: #333;
			stroke: #999;
			stroke-width: 1;
			pointer-events: none;
		}

		#scene-annotated #annotations text,
		#scene-annotated #annotations line {
			pointer-events: none;
		}

		/* Step 3 contrast and detail treatments apply only to the adjusted scene. */
		#scene-adjusted .tree > rect {
			stroke: #493423;
			stroke-width: 3;
		}

		#scene-adjusted .tree > circle {
			stroke: #245d2e;
			stroke-width: 2;
		}

		#scene-adjusted .house > rect {
			stroke: #493423;
			stroke-width: 3;
		}

		#scene-adjusted .house > polygon {
			stroke: #493423;
			stroke-width: 4;
		}

		#scene-adjusted .house > line {
			stroke: #315763;
			stroke-width: 3;
		}

		#scene-adjusted .fence {
			stroke: #72501f;
			stroke-width: 5;
			stroke-dasharray: 10 7;
		}

		#scene-adjusted .stone-walk {
			fill: none;
			stroke: #c6b99f;
			stroke-width: 16;
			stroke-dasharray: 1 13;
			stroke-linecap: round;
		}

		#scene-adjusted .mailbox-body {
			fill: #2d6f79;
			stroke: #183f47;
			stroke-width: 2;
		}

		#scene-adjusted .smoke {
			fill: #ffffff;
			stroke: #82949a;
			stroke-width: 1.5;
			opacity: 0.72;
		}
	</style>
</head>
<body>
	<main>
		<h1>T04 – SVG House &amp; Garden</h1>
		<figure id="scene-original">
		<svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-description">
			<title id="scene-title">A house and garden scene</title>
			<desc id="scene-description">A sunny garden with a cloud, tree, fenced yard, and a small house with a roof, chimney, door, and two windows.</desc>

			<!-- Sky and ground -->
			<rect x="0" y="0" width="800" height="350" fill="#bfe7f5"></rect>
			<rect x="0" y="350" width="800" height="150" fill="#77b255"></rect>

			<!-- Sun and cloud -->
			<circle cx="690" cy="85" r="48" fill="#ffd166" stroke="#e39a2d" stroke-width="4"></circle>
			<ellipse cx="160" cy="105" rx="70" ry="28" fill="#ffffff" opacity="0.9"></ellipse>
			<circle cx="115" cy="105" r="30" fill="#ffffff" opacity="0.9"></circle>
			<circle cx="180" cy="92" r="38" fill="#ffffff" opacity="0.9"></circle>

			<!-- Tree -->
			<rect x="92" y="250" width="34" height="125" fill="#805333"></rect>
			<circle cx="110" cy="210" r="65" fill="#3f9142"></circle>
			<circle cx="67" cy="242" r="45" fill="#4ca64f"></circle>
			<circle cx="155" cy="242" r="48" fill="#36813b"></circle>

			<!-- House -->
			<rect x="300" y="235" width="300" height="165" fill="#f3c969" stroke="#784d35" stroke-width="5"></rect>
			<polygon points="275,240 450,105 625,240" fill="#b94e45" stroke="#784d35" stroke-width="5"></polygon>
			<rect x="520" y="145" width="38" height="78" fill="#784d35" stroke="#5e3b2a" stroke-width="4"></rect>

			<!-- Door and windows -->
			<rect x="420" y="310" width="60" height="90" fill="#6d4936" stroke="#4c3427" stroke-width="4"></rect>
			<circle cx="467" cy="357" r="5" fill="#ffd166"></circle>
			<rect x="335" y="275" width="58" height="52" fill="#aee5f2" stroke="#4c7480" stroke-width="5"></rect>
			<line x1="364" y1="275" x2="364" y2="327" stroke="#4c7480" stroke-width="4"></line>
			<line x1="335" y1="301" x2="393" y2="301" stroke="#4c7480" stroke-width="4"></line>
			<rect x="507" y="275" width="58" height="52" fill="#aee5f2" stroke="#4c7480" stroke-width="5"></rect>
			<line x1="536" y1="275" x2="536" y2="327" stroke="#4c7480" stroke-width="4"></line>
			<line x1="507" y1="301" x2="565" y2="301" stroke="#4c7480" stroke-width="4"></line>

			<!-- Fence and curved garden path -->
			<polyline points="25,355 25,315 55,315 55,355 85,355 85,315 115,315 115,355 145,355 145,315 175,315 175,355" fill="none" stroke="#f5e0a3" stroke-width="8"></polyline>
			<path d="M450 400 C430 425 405 450 370 500 L530 500 C495 450 475 425 450 400 Z" fill="#d9c29c" stroke="#9b805c" stroke-width="3"></path>

			<!-- Caption -->
			<text x="400" y="475" text-anchor="middle" fill="#234b59" font-size="20" font-weight="bold">A peaceful house and garden</text>
		</svg>
			<figcaption>Original scene</figcaption>
		</figure>

		<figure id="scene-annotated-figure">
		<svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-description">
			<title id="scene-title">A house and garden scene</title>
			<desc id="scene-description">A sunny garden with a cloud, tree, fenced yard, and a small house with a roof, chimney, door, and two windows.</desc>

			<!-- Sky and ground -->
			<rect x="0" y="0" width="800" height="350" fill="#bfe7f5"></rect>
			<rect x="0" y="350" width="800" height="150" fill="#77b255"></rect>

			<!-- Sun and cloud -->
			<circle cx="690" cy="85" r="48" fill="#ffd166" stroke="#e39a2d" stroke-width="4"></circle>
			<ellipse cx="160" cy="105" rx="70" ry="28" fill="#ffffff" opacity="0.9"></ellipse>
			<circle cx="115" cy="105" r="30" fill="#ffffff" opacity="0.9"></circle>
			<circle cx="180" cy="92" r="38" fill="#ffffff" opacity="0.9"></circle>

			<!-- Tree -->
			<rect x="92" y="250" width="34" height="125" fill="#805333"></rect>
			<circle cx="110" cy="210" r="65" fill="#3f9142"></circle>
			<circle cx="67" cy="242" r="45" fill="#4ca64f"></circle>
			<circle cx="155" cy="242" r="48" fill="#36813b"></circle>

			<!-- House -->
			<rect x="300" y="235" width="300" height="165" fill="#f3c969" stroke="#784d35" stroke-width="5"></rect>
			<polygon points="275,240 450,105 625,240" fill="#b94e45" stroke="#784d35" stroke-width="5"></polygon>
			<rect x="520" y="145" width="38" height="78" fill="#784d35" stroke="#5e3b2a" stroke-width="4"></rect>

			<!-- Door and windows -->
			<rect x="420" y="310" width="60" height="90" fill="#6d4936" stroke="#4c3427" stroke-width="4"></rect>
			<circle cx="467" cy="357" r="5" fill="#ffd166"></circle>
			<rect x="335" y="275" width="58" height="52" fill="#aee5f2" stroke="#4c7480" stroke-width="5"></rect>
			<line x1="364" y1="275" x2="364" y2="327" stroke="#4c7480" stroke-width="4"></line>
			<line x1="335" y1="301" x2="393" y2="301" stroke="#4c7480" stroke-width="4"></line>
			<rect x="507" y="275" width="58" height="52" fill="#aee5f2" stroke="#4c7480" stroke-width="5"></rect>
			<line x1="536" y1="275" x2="536" y2="327" stroke="#4c7480" stroke-width="4"></line>
			<line x1="507" y1="301" x2="565" y2="301" stroke="#4c7480" stroke-width="4"></line>

			<!-- Fence and curved garden path -->
			<polyline points="25,355 25,315 55,315 55,355 85,355 85,315 115,315 115,355 145,355 145,315 175,315 175,355" fill="none" stroke="#f5e0a3" stroke-width="8"></polyline>
			<path d="M450 400 C430 425 405 450 370 500 L530 500 C495 450 475 425 450 400 Z" fill="#d9c29c" stroke="#9b805c" stroke-width="3"></path>

			<!-- Caption -->
			<text x="400" y="475" text-anchor="middle" fill="#234b59" font-size="20" font-weight="bold">A peaceful house and garden</text>

			<g id="annotations">
				<line x1="595" y1="35" x2="665" y2="70"></line>
				<text x="590" y="28">circle (cx=690, cy=85, r=48)</text>

				<line x1="18" y1="220" x2="92" y2="270"></line>
				<text x="12" y="210">rect (x=92, y=250, width=34, height=125)</text>

				<line x1="72" y1="65" x2="125" y2="92"></line>
				<text x="12" y="55">ellipse (cx=160, cy=105, rx=70, ry=28)</text>

				<line x1="235" y1="285" x2="364" y2="301"></line>
				<text x="205" y="278">line (x1=335, y1=301) -&gt; (x2=393, y2=301)</text>

				<line x1="28" y1="395" x2="55" y2="350"></line>
				<text x="12" y="410">polyline (25,355 25,315 55,315)</text>

				<line x1="610" y1="185" x2="590" y2="205"></line>
				<text x="605" y="175">polygon (275,240 450,105 625,240)</text>

				<line x1="575" y1="425" x2="500" y2="445"></line>
				<text x="570" y="418">path (M450 400 C430 425 ... L530 500)</text>

				<line x1="575" y1="480" x2="500" y2="475"></line>
				<text x="570" y="492">text (x=400, y=475)</text>
			</g>
		</svg>
			<figcaption>Annotated scene (Step 2)</figcaption>
		</figure>

			<figure id="scene-adjusted-figure">
			<svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="adjusted-title adjusted-description">
				<title id="adjusted-title">Adjusted house and garden scene</title>
				<desc id="adjusted-description">The house and tree are slightly repositioned, with a dashed fence, stone path, mailbox, and chimney smoke.</desc>

				<!-- Sky and ground -->
				<rect x="0" y="0" width="800" height="350" fill="#bfe7f5"></rect>
				<rect x="0" y="350" width="800" height="150" fill="#77b255"></rect>

				<!-- Sun and cloud -->
				<circle cx="690" cy="85" r="48" fill="#ffd166" stroke="#e39a2d" stroke-width="4"></circle>
				<ellipse cx="160" cy="105" rx="70" ry="28" fill="#ffffff" opacity="0.9"></ellipse>
				<circle cx="115" cy="105" r="30" fill="#ffffff" opacity="0.9"></circle>
				<circle cx="180" cy="92" r="38" fill="#ffffff" opacity="0.9"></circle>

				<!-- Small tree shift balances the house adjustment. -->
				<g class="tree" transform="translate(10 0)">
					<rect x="92" y="250" width="34" height="125" fill="#805333"></rect>
					<circle cx="110" cy="210" r="65" fill="#3f9142"></circle>
					<circle cx="67" cy="242" r="45" fill="#4ca64f"></circle>
					<circle cx="155" cy="242" r="48" fill="#36813b"></circle>
				</g>

				<!-- Shift the house slightly left; scoped CSS strengthens its outlines. -->
				<g class="house" transform="translate(-8 0)">
					<rect x="300" y="235" width="300" height="165" fill="#f3c969" stroke="#784d35" stroke-width="5"></rect>
					<polygon points="275,240 450,105 625,240" fill="#b94e45" stroke="#784d35" stroke-width="5"></polygon>
					<rect x="520" y="145" width="38" height="78" fill="#784d35" stroke="#5e3b2a" stroke-width="4"></rect>

					<!-- Door and windows -->
					<rect x="420" y="310" width="60" height="90" fill="#6d4936" stroke="#4c3427" stroke-width="4"></rect>
					<circle cx="467" cy="357" r="5" fill="#ffd166"></circle>
					<rect x="335" y="275" width="58" height="52" fill="#aee5f2" stroke="#4c7480" stroke-width="5"></rect>
					<line x1="364" y1="275" x2="364" y2="327" stroke="#4c7480" stroke-width="4"></line>
					<line x1="335" y1="301" x2="393" y2="301" stroke="#4c7480" stroke-width="4"></line>
					<rect x="507" y="275" width="58" height="52" fill="#aee5f2" stroke="#4c7480" stroke-width="5"></rect>
					<line x1="536" y1="275" x2="536" y2="327" stroke="#4c7480" stroke-width="4"></line>
					<line x1="507" y1="301" x2="565" y2="301" stroke="#4c7480" stroke-width="4"></line>
				</g>

				<!-- Increase fence contrast and use a dashed stroke. -->
				<polyline class="fence" points="25,355 25,315 55,315 55,355 85,355 85,315 115,315 115,355 145,355 145,315 175,315 175,355" fill="none" stroke="#f5e0a3" stroke-width="8"></polyline>
				<path d="M450 400 C430 425 405 450 370 500 L530 500 C495 450 475 425 450 400 Z" fill="#d9c29c" stroke="#9b805c" stroke-width="3"></path>

				<!-- Dashed rounded marks create a curved stone walk up to the shifted door. -->
				<path class="stone-walk" d="M442 500 C448 465 456 433 442 400"></path>

				<!-- Small mailbox beside the path. -->
				<rect class="mailbox-body" x="500" y="425" width="27" height="18" rx="2"></rect>
				<polygon points="498,425 513.5,413 529,425" fill="#d9e1df" stroke="#183f47" stroke-width="2"></polygon>
				<rect x="511" y="443" width="5" height="30" fill="#493423"></rect>

				<!-- Soft ellipses suggest a small puff drifting from the chimney. -->
				<ellipse class="smoke" cx="539" cy="134" rx="12" ry="8"></ellipse>
				<ellipse class="smoke" cx="550" cy="120" rx="10" ry="7"></ellipse>
				<ellipse class="smoke" cx="541" cy="107" rx="8" ry="6"></ellipse>

				<!-- Caption -->
				<text x="400" y="475" text-anchor="middle" fill="#234b59" font-size="20" font-weight="bold">A peaceful house and garden</text>
			</svg>
				<figcaption>Adjusted scene (Step 3)</figcaption>
			</figure>
	</main>
</body>
</html>
